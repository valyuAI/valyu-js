name: Build & Publish

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - name: Upgrade npm for OIDC support
        # npm 12.0.0 breaks `npm publish --provenance` (its global install
        # drops the sigstore module that libnpmpublish still requires), so
        # stay on the 11.x line until 12 is fixed.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "valyu-js@$VERSION" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish with provenance
        if: steps.check.outputs.skip == 'false'
        # npm moves `latest` to whatever was just published, even a lower
        # version. A version below the current `latest` (a branch that kept an
        # older number) is published under `previous`, so installs never
        # downgrade.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LATEST=$(npm view valyu-js dist-tags.latest 2>/dev/null || true)
          TAG=latest
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            TAG=previous
          fi
          echo "Publishing $VERSION with tag $TAG (latest is ${LATEST:-unset})"
          npm publish --provenance --access public --tag "$TAG"
